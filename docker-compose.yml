services:
  db:
    image: mysql:8.4
    container_name: mymdecks_db
    profiles:
      - container-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in the root .env file}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flyermym}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: mymdecks_backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      PORT: 6005
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Define DOCKER_DATABASE_URL in the root .env file}
      BASE_URL: http://localhost:6005
      VISOR_ORIGIN: http://localhost:6003
      DASHBOARD_ORIGIN: http://localhost:6002
    ports:
      - "6005:6005"
    volumes:
      - ./Backend/uploads:/app/uploads

  dashboard:
    build:
      context: ./Dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_API_URL: http://localhost:6005
        NEXT_PUBLIC_SOCKET_URL: http://localhost:6005
        NEXT_PUBLIC_STATIC_URL: http://localhost:6005
    container_name: mymdecks_dashboard
    restart: unless-stopped
    environment:
      PORT: 6002
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: http://backend:6005
    ports:
      - "6002:6002"
    depends_on:
      - backend

  visor:
    build:
      context: ./Visor
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: http://localhost:6005
        NEXT_PUBLIC_SOCKET_PATH: /socket.io
    container_name: mymdecks_visor
    restart: unless-stopped
    environment:
      PORT: 6003
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: http://backend:6005
    ports:
      - "6003:6003"
    depends_on:
      - backend

volumes:
  db_data:
